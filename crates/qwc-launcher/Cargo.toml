[package]
name = "qwc-launcher"
version.workspace = true
description = "The remaster's launcher: the player's game files and unwrapped exe checked and imported, then Play"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
qwc-feck = { path = "../qwc-feck" }
qwc-formats = { path = "../qwc-formats" }
qwc-net = { path = "../qwc-net" }
qwc-packs = { path = "../qwc-packs" }
qwc-settings = { path = "../qwc-settings" }
qwc-style = { path = "../qwc-style" }
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11", "clipboard"] }
rfd = "0.17.2"
# the window's handle, to cut its corners on Windows (`app::shape`); eframe's own version
raw-window-handle = "0.6.2"
sha2 = "0.11.1"
png = "0.17"
ureq = "3.5.0"
serde = { version = "1", features = ["derive"] }
ron = "0.12"
serde_json = { workspace = true }
semver = "1"

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["wgpu"] }

# the exe's icon (build.rs)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
