[package]
name = "qwc-packs"
version.workspace = true
description = "Resource packs: the manifest, the player's profile and load order, the slots a pack fills, building and installing .qwcpack files"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
qwc-assets = { path = "../qwc-assets" }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
semver = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
