[package]
name = "qwc-render"
version.workspace = true
description = "wgpu renderer for the QWC remaster"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
qwc-assets = { path = "../qwc-assets" }
qwc-formats = { path = "../qwc-formats" }
wgpu = "30"
# the packs' shaders checked before the GPU sees them (the version wgpu 30 uses)
naga = { version = "30", features = ["wgsl-in"] }
bytemuck = { version = "1", features = ["derive"] }
glam = "0.30"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
ron = "0.12"
