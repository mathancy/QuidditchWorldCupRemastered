[package]
name = "qwc-video"
version.workspace = true
description = "The remastered movies (H.264 and AAC in MP4) for the QWC remaster"
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
qwc-formats = { path = "../qwc-formats" }
# OpenH264 built from its bundled source (with NASM's assembly when `nasm` is on the PATH)
openh264 = "0.9.9"
# the MP4 reader and the AAC decoder, pure Rust
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "aac"] }

# Windows' own decoders, used first there
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }
